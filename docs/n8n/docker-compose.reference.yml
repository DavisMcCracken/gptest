# RMH-144 reference Compose — NOT for production without human approval (gate A1+).
# Deploy from /opt/rmhck/n8n on Fedora with secrets in /etc/rmhck/n8n/*.env

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    networks:
      - rmhck-n8n-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n -d n8n']
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:1.82.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /etc/rmhck/n8n/n8n.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      GENERIC_TIMEZONE: America/Chicago
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    volumes:
      - /data/n8n:/home/node/.n8n
    networks:
      - rmhck-n8n-internal
    # Do not publish ports directly; use caddy or SSH tunnel for admin UI.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      # Bind to localhost only; adjust after gate A2 (host security).
      - '127.0.0.1:8443:443'
    volumes:
      - ./Caddyfile.reference:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rmhck-n8n-internal

networks:
  rmhck-n8n-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
